[phases.setup]
nixPkgs = ['python311', 'gcc']
aptPkgs = ['libpq-dev', 'python3-dev']

[phases.install]
cmds = ['cd backend && pip install -r requirements.txt']

[phases.build]
cmds = ['echo "Build complete"']

[start]
cmd = 'cd backend && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2'
