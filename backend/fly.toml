app = 'statementwise-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENV = 'production'
  PORT = '8000'
  HOST = '0.0.0.0'
  WORKERS = '2'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'statementwise_data'
  destination = '/tmp/statementwise'
