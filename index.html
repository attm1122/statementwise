  <head>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Statementwise.ai — AI-Native Bank Statement Converter" />
    <meta name="description" content="Convert any bank statement PDF to Excel, CSV, QBO, OFX, or JSON with 99%+ AI accuracy. Credits never expire. Free tier available." />
    <meta name="keywords" content="bank statement converter, PDF to Excel, PDF to CSV, QBO export, OFX export, accounting tool, bookkeeping, AI extraction" />
    <meta name="author" content="Statementwise.ai" />
    <meta name="theme-color" content="#050B14" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://statementwiseai.com/" />
    <meta property="og:title" content="Statementwise.ai — AI-Native Bank Statement Converter" />
    <meta property="og:description" content="Convert any bank statement PDF to Excel, CSV, QBO, OFX, or JSON with 99%+ AI accuracy. Credits never expire." />
    <meta property="og:image" content="https://statementwiseai.com/og-image.png" />
    <meta property="og:site_name" content="Statementwise.ai" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://statementwiseai.com/" />
    <meta property="twitter:title" content="Statementwise.ai — AI-Native Bank Statement Converter" />
    <meta property="twitter:description" content="Convert any bank statement PDF to Excel, CSV, QBO, OFX, or JSON with 99%+ AI accuracy. Credits never expire." />
    <meta property="twitter:image" content="https://statementwiseai.com/og-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://statementwiseai.com/" />

    <!--
      Content Security Policy (CSP)
      - script-src 'self': Only load scripts from same origin
      - style-src 'self' 'unsafe-inline': Allow inline styles (required for Tailwind CSS-in-JS and CSS custom properties)
      - img-src 'self' data: blob:: Allow images from same origin, data URIs, and blob URLs
      - font-src 'self' https://fonts.gstatic.com: Allow self-hosted and Google Fonts
      - connect-src includes the production API, Stripe, and optional Sentry intake
      - frame-ancestors 'none': Prevent clickjacking by disallowing iframe embedding
      - base-uri 'self': Restrict base tag to same origin
      - form-action 'self': Form submissions restricted to same origin
      - No 'unsafe-eval': Prevents eval() and similar dynamic code execution
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.statementwiseai.com https://statementwise-production.up.railway.app https://*.sentry.io https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; upgrade-insecure-requests;"
    />

    <!-- Anti-Clickjacking: X-Frame-Options (complement to CSP frame-ancestors) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- MIME-Type Sniffing Protection -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Referrer Policy: Limit referrer information leakage -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Permissions Policy: Restrict browser features -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" />

    <!-- Cache Control for Sensitive Application -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, proxy-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- DNS Prefetch and Preconnect for External Resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Statementwise.ai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
